<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='720' viewBox='0 0 1200 720' role='img' aria-label='CNT Rope Structure timeline visual'>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#0d0d0d'/>
      <stop offset='52%' stop-color='#1b1b1b'/>
      <stop offset='100%' stop-color='#2f2f2f'/>
    </linearGradient>
    <radialGradient id='glowA' cx='86%' cy='14%' r='56%'>
      <stop offset='0%' stop-color='#adadad' stop-opacity='0.22'/>
      <stop offset='100%' stop-color='#adadad' stop-opacity='0'/>
    </radialGradient>
    <radialGradient id='glowB' cx='8%' cy='88%' r='46%'>
      <stop offset='0%' stop-color='#afafaf' stop-opacity='0.18'/>
      <stop offset='100%' stop-color='#afafaf' stop-opacity='0'/>
    </radialGradient>
    <pattern id='mesh' width='36' height='36' patternUnits='userSpaceOnUse'>
      <path d='M0 0 H36 M0 0 V36' stroke='rgba(180,180,180,0.08)' stroke-width='1'/>
    </pattern>
    <linearGradient id='leftPanel' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='rgba(14,14,14,0.92)'/>
      <stop offset='100%' stop-color='rgba(19,19,19,0.86)'/>
    </linearGradient>
    <linearGradient id='rightPanel' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='rgba(16,16,16,0.92)'/>
      <stop offset='100%' stop-color='rgba(21,21,21,0.86)'/>
    </linearGradient>
    <linearGradient id='bar' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0%' stop-color='#afafaf'/>
      <stop offset='100%' stop-color='#adadad'/>
    </linearGradient>
    <style>
      .kicker { font: 700 17px 'Segoe UI', Arial, sans-serif; letter-spacing: 3px; fill: #c8c8c8; text-transform: uppercase; }
      .title { font: 700 54px 'Segoe UI', Arial, sans-serif; fill: #f8f8f8; }
      .family { font: 600 24px 'Segoe UI', Arial, sans-serif; fill: #dedede; }
      .label { font: 700 14px 'Segoe UI', Arial, sans-serif; letter-spacing: 1.3px; fill: #a4a4a4; text-transform: uppercase; }
      .value { font: 600 28px 'Segoe UI', Arial, sans-serif; fill: #f2f2f2; }
      .year { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #dbdbdb; }
      .sigHead { font: 700 14px 'Segoe UI', Arial, sans-serif; letter-spacing: 1.2px; fill: #e1e1e1; text-transform: uppercase; }
      .signal { font: 600 17px 'Segoe UI', Arial, sans-serif; fill: #ededed; }
      .signalSub { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #d5d5d5; }
      .foot { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #afafaf; }
    </style>
  </defs>

  <rect width='1200' height='720' fill='url(#bg)'/>
  <rect width='1200' height='720' fill='url(#mesh)' opacity='0.56'/>
  <rect width='1200' height='720' fill='url(#glowA)'/>
  <rect width='1200' height='720' fill='url(#glowB)'/>

  <rect x='10' y='10' width='1180' height='700' rx='20' fill='none' stroke='rgba(186,186,186,0.28)'/>

  <rect x='60' y='58' width='620' height='604' rx='24' fill='url(#leftPanel)' stroke='rgba(189,189,189,0.34)'/>
  <rect x='700' y='108' width='440' height='500' rx='22' fill='url(#rightPanel)' stroke='rgba(189,189,189,0.32)'/>

  <text x='94' y='114' class='kicker'>HEXCARB HISTORY VISUAL</text>
  <text x='94' y='176' class='title'><tspan x='94' dy='0'>CNT Rope Structure</tspan></text>
  <text x='94' y='228' class='family'><tspan x='94' dy='0'>SWCNT</tspan></text>
  <line x1='94' y1='258' x2='646' y2='258' stroke='rgba(194,194,194,0.34)'/>

  <text x='94' y='298' class='label'>Breakthrough</text>
  <text x='94' y='328' class='value'><tspan x='94' dy='0'>Characterization</tspan><tspan x='94' dy='34'>advance</tspan></text>

  <text x='94' y='430' class='label'>Confidence</text>
  <text x='94' y='462' class='value'>Strong</text>

  <text x='94' y='528' class='label'>Deployment</text>
  <text x='94' y='560' class='value'>Pilot</text>

  <rect x='94' y='592' width='500' height='11' rx='5.5' fill='rgba(178,178,178,0.32)'/>
  <rect x='94' y='592' width='330' height='11' rx='5.5' fill='url(#bar)'/>
  <text x='94' y='626' class='foot'>Qualification progression</text>

  <text x='728' y='166' class='year'>Milestone year: 1996</text>
  <text x='728' y='198' class='sigHead'>Key signals</text>
  <line x1='728' y1='210' x2='1112' y2='210' stroke='rgba(194,194,194,0.32)'/>
  <text x='728' y='276' class='signal'><tspan x='728' dy='0'>- Crystalline rope</tspan></text><text x='750' y='304' class='signalSub'><tspan x='750' dy='0'>transport studies</tspan></text><text x='728' y='342' class='signal'><tspan x='728' dy='0'>- Structure-property links</tspan></text><text x='750' y='370' class='signalSub'><tspan x='750' dy='0'>strengthened</tspan></text><text x='728' y='408' class='signal'><tspan x='728' dy='0'>- Qualification metrics</tspan></text><text x='750' y='436' class='signalSub'><tspan x='750' dy='0'>improved</tspan></text>

  <text x='728' y='572' class='foot'>Evidence-first timeline module</text>
</svg>
